# One port per fault, so each test changes exactly one variable. All four serve the
# same trivial body -- if you get the body, TLS succeeded; that is the whole signal.
events {}
http {
  access_log /dev/stdout;

  # 8443 -- correct: leaf + intermediate, valid dates, SAN lab.local.
  server {
    listen 8443 ssl;
    ssl_certificate     /certs/fullchain.crt;
    ssl_certificate_key /certs/server.key;
    location / { return 200 "good chain\n"; }
  }

  # 8444 -- expired: same trusted chain, validity window in 2020.
  server {
    listen 8444 ssl;
    ssl_certificate     /certs/expired-chain.crt;
    ssl_certificate_key /certs/expired.key;
    location / { return 200 "expired\n"; }
  }

  # 8445 -- untrusted CA: right hostname, valid dates, signed by a CA you don't trust.
  server {
    listen 8445 ssl;
    ssl_certificate     /certs/rogue-chain.crt;
    ssl_certificate_key /certs/rogue.key;
    location / { return 200 "rogue CA\n"; }
  }

  # 8446 -- missing intermediate: the *same good leaf* as 8443, sent alone. The
  # client trusts the root but has no way to bridge root -> leaf.
  server {
    listen 8446 ssl;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / { return 200 "leaf only\n"; }
  }
}
